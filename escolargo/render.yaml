services:
  - type: web
    name: escolargo
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escolargo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: TZ_SCHOOL
        value: America/Bogota

databases:
  - name: escolargo-db
    plan: free
    region: oregon
